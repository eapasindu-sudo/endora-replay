name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else { $v = "1.0.0-ci.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building $v"

      - name: Restore
        run: dotnet restore EndoraReplay.sln

      - name: Test
        run: dotnet test tests/EndoraReplay.Core.Tests -c Release --no-restore --logger "trx;LogFileName=results.trx"

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish src/EndoraReplay.App/EndoraReplay.App.csproj -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous release (for delta updates)
        if: github.ref_type == 'tag'
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack installer
        run: >
          vpk pack --packId EndoraReplay --packVersion ${{ steps.ver.outputs.version }} --packDir publish
          --mainExe EndoraReplay.exe --packTitle "Endora Replay" --packAuthors "Endora"
          --icon src/EndoraReplay.App/Assets/endora.ico --outputDir Releases

      - uses: actions/upload-artifact@v4
        with:
          name: EndoraReplay-${{ steps.ver.outputs.version }}
          path: Releases/*

      - name: Publish GitHub release (enables auto-update)
        if: github.ref_type == 'tag'
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          --publish --releaseName "Endora Replay ${{ steps.ver.outputs.version }}" --tag ${{ github.ref_name }} --outputDir Releases
